<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom WAS 소개</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
            background: #fafafa;
            color: #222;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 18px 64px;
        }
        header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 18px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }
        header img {
            width: 92px;
            height: 92px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid #eee;
            background: #f6f6f6;
        }
        h1 { margin: 0; font-size: 22px; }
        .subtitle { margin: 4px 0 0; color: #666; font-size: 14px; }

        main {
            margin-top: 18px;
            padding: 22px 18px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }
        h2 { margin: 0 0 10px; font-size: 18px; }
        ul { margin: 10px 0 0 18px; }
        code {
            background: #f2f2f2;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.95em;
        }
        .note {
            margin-top: 14px;
            padding: 12px 12px;
            background: #f7fbff;
            border: 1px solid #d7ebff;
            border-radius: 12px;
            color: #1e3a5f;
            font-size: 14px;
        }
        footer {
            margin-top: 18px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <header>
        <!-- 이미지 파일명을 img.png 로 저장해두고 같은 폴더에 두세요 -->
        <img src="./img.png" alt="dochi" />
        <div>
            <h1>Dochi</h1>
            <p class="subtitle">자바로 직접 구현한, HTTP 서버/WAS 실험 프로젝트</p>
        </div>
    </header>

    <main>
        <h2>무엇을 만들었나요?</h2>
        <p>
            WAS를 바닥부터 직접 구현하면서 low-high level 간에 동작 원리를 학습하고 성능 측정과 개선을 반복하며 만들었습니다.
        </p>
    </main>
</div>
</body>
</html>
